name: Build Development Firmware

# Builds the firmware environments used by the fork's development branch.
# The workflow is also available manually from any selected branch.

on:
  push:
    branches:
      - development
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-development-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-development-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build development firmware
        run: |
          set -euo pipefail
          make firmware-development | tee pio-development.log

      - name: Summarize build
        run: |
          set -euo pipefail
          {
            echo "## Development firmware — \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo
            if grep -E "RAM:\\s|Flash:\\s" pio-development.log; then
              echo
            fi
            echo "Artifacts:"
            find .pio/build -type f -name 'firmware-*.bin' -print | sort | while read -r artifact; do
              echo "- \`${artifact}\` — SHA256 \`$(sha256sum "$artifact" | cut -d' ' -f1)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload development firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-development-${{ github.ref_name }}
          path: .pio/build/*/firmware-*.bin
          if-no-files-found: error
          retention-days: 30
